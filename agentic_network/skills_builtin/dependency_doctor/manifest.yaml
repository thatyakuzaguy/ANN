name: dependency_doctor
version: 1.0
description: Runtime, manifest, lockfile, and dependency compatibility diagnostics without installs.
enabled: true
requires_user_approval: true
audit_enabled: true
permissions:
  network: DENY
  filesystem_read: ASK_ALWAYS
  filesystem_write: DENY
  git_read: DENY
  git_write: DENY
  terminal_execute: DENY
