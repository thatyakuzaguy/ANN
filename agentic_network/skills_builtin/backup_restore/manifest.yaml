name: backup_restore
version: 1.0
description: PostgreSQL backup, restore, retention, and recovery verification through approved Compose recipes.
enabled: true
requires_user_approval: true
audit_enabled: true
permissions:
  network: DENY
  filesystem_read: ASK_ALWAYS
  filesystem_write: ASK_ALWAYS
  git_read: DENY
  git_write: DENY
  terminal_execute: ASK_ALWAYS
