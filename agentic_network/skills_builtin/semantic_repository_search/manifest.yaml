name: semantic_repository_search
version: 1.0
description: Bounded intent-term repository path and symbol search without model loading.
enabled: true
requires_user_approval: true
audit_enabled: true
permissions:
  network: DENY
  filesystem_read: ASK_ALWAYS
  filesystem_write: DENY
  git_read: DENY
  git_write: DENY
  terminal_execute: DENY
