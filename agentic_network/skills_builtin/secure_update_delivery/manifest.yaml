name: secure_update_delivery
version: 1.0
description: Offline update metadata, signature, hash, expiry, freeze, and rollback verification.
enabled: true
requires_user_approval: true
audit_enabled: true
permissions:
  network: DENY
  filesystem_read: ASK_ALWAYS
  filesystem_write: DENY
  git_read: DENY
  git_write: DENY
  terminal_execute: DENY
