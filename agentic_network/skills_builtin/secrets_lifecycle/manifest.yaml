name: secrets_lifecycle
version: 1.0
description: Value-free secret ownership, rotation, revocation, redaction, and rollback planning.
enabled: true
requires_user_approval: true
audit_enabled: true
permissions:
  network: DENY
  filesystem_read: ASK_ALWAYS
  filesystem_write: DENY
  git_read: DENY
  git_write: DENY
  terminal_execute: DENY
