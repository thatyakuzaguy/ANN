name: package_registry
version: 1.0
description: Read-only PyPI and npm metadata lookup through fixed registry endpoints; installation is unavailable.
enabled: true
requires_user_approval: true
audit_enabled: true
permissions:
  network: ASK_ALWAYS
  filesystem_read: DENY
  filesystem_write: DENY
  git_read: DENY
  git_write: DENY
  terminal_execute: DENY
